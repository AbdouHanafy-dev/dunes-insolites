name: CI

# Two gates:
#   unit         — typecheck, lint, frontend vitest, backend surefire (*Test),
#                  and the static production-config validation. Fast, no Docker.
#   integration  — backend failsafe (*IT): full Spring context against real
#                  Postgres + RabbitMQ via Testcontainers (Docker on the runner).
#
# CI fails if EITHER gate fails. Integration tests are not excluded to keep the
# pipeline green — they run for real (see backend/src/test/**/*IT.java).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Secret scan (committed files)
        run: npm run scan:secrets
      - name: Dependency audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Frontend + admin unit tests (vitest)
        run: npm run test:web
        # includes frontend/lib/seo-contract.test.ts — the offline SEO/migration
        # response-contract guards (canonical strategy, hreflang reciprocity,
        # redirect-map has no loops/chains/homepage-301s, nginx allowlist stays
        # in sync with lib/legacySlugs.ts). No network.
      - name: Production config validation
        run: npm run validate:prod-config
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Backend unit tests (surefire)
        run: npm run backend:test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Backend integration tests (Testcontainers — Postgres + RabbitMQ)
        # Ubuntu runners ship Docker; Testcontainers uses it directly.
        run: npm run backend:test:it

      - name: Frontend fail-closed build check
        # A production build with no backend and no seed opt-in MUST fail.
        run: |
          if npm run build --workspace frontend; then
            echo "::error::frontend build succeeded with no NEXT_PUBLIC_API_URL and no ALLOW_SEED_FALLBACK — it must fail closed"
            exit 1
          fi
          echo "frontend build correctly failed closed"
        env:
          NEXT_PUBLIC_API_URL: ""
          ALLOW_SEED_FALLBACK: ""

  # Optional, opt-in: hits a REAL public host read-only. Runs only when the
  # repo/environment sets the SEO_BASE_URL variable (never a secret — it is a
  # public URL). Does not gate merges; it is a live-state canary for the
  # WordPress baseline before Phase 7, and for the Next.js contract after.
  seo-live-canary:
    runs-on: ubuntu-latest
    if: vars.SEO_BASE_URL != ''
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: SEO URL contract against ${{ vars.SEO_BASE_URL }}
        run: node scripts/verify-production-urls.mjs
        env:
          BASE_URL: ${{ vars.SEO_BASE_URL }}
          SEO_PROFILE: ${{ vars.SEO_PROFILE || 'wordpress' }}

  # Continuous deployment — only after both gates above are green, and only
  # for a real push to main (never a PR, never a fork). /opt/dunes on the VPS
  # is a real git clone tracking origin/main (set up 15 Sep 2026, via a
  # read-only GitHub Deploy Key — see docs/reports/seo-cutover-readiness-
  # 2026-09-15.md §6); this job's SSH key (VPS_SSH_KEY) is a *separate*,
  # dedicated credential, authorized only for this one root login, distinct
  # from both the deploy key and the owner's personal SSH key.
  #
  # dunes-insolites.com is the LIVE site as of the 15 Sep cutover — this
  # deploys straight to it, not to the old no-hyphen staging domain.
  deploy:
    needs: [unit, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to the VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 79.143.185.33
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/dunes
            git fetch origin main
            git reset --hard origin/main
            cd backend
            docker compose -p dunes-v2 -f docker-compose.vps.yml --env-file .env.vps build frontend admin backend
            docker compose -p dunes-v2 -f docker-compose.vps.yml --env-file .env.vps up -d frontend admin backend

      - name: Post-deploy smoke check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 79.143.185.33
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            for i in $(seq 1 12); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8090/actuator/health || echo 000)
              [ "$code" = "200" ] && break
              sleep 5
            done
            [ "$code" = "200" ] || { echo "backend health check failed after deploy"; exit 1; }
            curl -sf -o /dev/null https://www.dunes-insolites.com/
            curl -sf -o /dev/null https://admin.dunesinsolites.com/
            echo "deploy verified: backend healthy, frontend + admin responding"
