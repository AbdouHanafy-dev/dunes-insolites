name: CI

# Two gates:
#   unit         — typecheck, lint, frontend vitest, backend surefire (*Test),
#                  and the static production-config validation. Fast, no Docker.
#   integration  — backend failsafe (*IT): full Spring context against real
#                  Postgres + RabbitMQ via Testcontainers (Docker on the runner).
#
# CI fails if EITHER gate fails. Integration tests are not excluded to keep the
# pipeline green — they run for real (see backend/src/test/**/*IT.java).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Secret scan (committed files)
        run: npm run scan:secrets
      - name: Dependency audit (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Frontend + admin unit tests (vitest)
        run: npm run test:web
        # includes frontend/lib/seo-contract.test.ts — the offline SEO/migration
        # response-contract guards (canonical strategy, hreflang reciprocity,
        # redirect-map has no loops/chains/homepage-301s, nginx allowlist stays
        # in sync with lib/legacySlugs.ts). No network.
      - name: Production config validation
        run: npm run validate:prod-config
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Backend unit tests (surefire)
        run: npm run backend:test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - name: Backend integration tests (Testcontainers — Postgres + RabbitMQ)
        # Ubuntu runners ship Docker; Testcontainers uses it directly.
        run: npm run backend:test:it

      - name: Frontend fail-closed build check
        # A production build with no backend and no seed opt-in MUST fail.
        run: |
          if npm run build --workspace frontend; then
            echo "::error::frontend build succeeded with no NEXT_PUBLIC_API_URL and no ALLOW_SEED_FALLBACK — it must fail closed"
            exit 1
          fi
          echo "frontend build correctly failed closed"
        env:
          NEXT_PUBLIC_API_URL: ""
          ALLOW_SEED_FALLBACK: ""

  # Continuous deployment — only after both gates above are green, and only
  # for a real push to main (never a PR, never a fork). /opt/dunes on the VPS
  # is a real git clone tracking origin/main (set up 15 Sep 2026, via a
  # read-only GitHub Deploy Key — see docs/reports/seo-cutover-readiness-
  # 2026-09-15.md §6); this job's SSH key (VPS_SSH_KEY) is a *separate*,
  # dedicated credential, authorized only for this one root login, distinct
  # from both the deploy key and the owner's personal SSH key.
  #
  # dunes-insolites.com is the LIVE site as of the 15 Sep cutover — this
  # deploys straight to it, not to the old no-hyphen staging domain.
  deploy:
    needs: [unit, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Two pushes to main in quick succession ran two deploys at once on the same
    # VPS; the second hit a half-recreated container ("name already in use").
    # One deploy at a time, queued rather than cancelled mid-recreate.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - name: Deploy to the VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 79.143.185.33
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/dunes
            git fetch origin main
            git reset --hard origin/main
            cd backend
            docker compose -p dunes-v2 -f docker-compose.vps.yml --env-file .env.vps build frontend admin backend
            docker compose -p dunes-v2 -f docker-compose.vps.yml --env-file .env.vps up -d frontend admin backend

      - name: Post-deploy smoke check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 79.143.185.33
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          # actuator/health lives on the backend's private management port
          # (9099), which is never published to the host — only reachable
          # from inside the container itself, or via Docker's own compose
          # healthcheck (which already checks it, correctly, on that port).
          # Reading that healthcheck's own verdict is more reliable than
          # guessing at a port from the outside. The image has a 90-second
          # startup grace period, so allow enough time for real cold starts.
          script: |
            set -e
            status=starting
            for i in $(seq 1 48); do
              status=$(docker inspect -f '{{.State.Health.Status}}' dunes-v2-backend 2>/dev/null || echo starting)
              [ "$status" = "healthy" ] && break
              sleep 5
            done
            if [ "$status" != "healthy" ]; then
              echo "backend did not become healthy after deploy (status: $status)"
              echo "--- recent Docker health probes ---"
              docker inspect -f '{{range .State.Health.Log}}{{.End}} exit={{.ExitCode}} {{printf "%q" .Output}}{{println}}{{end}}' dunes-v2-backend 2>/dev/null || true
              echo "--- recent backend logs ---"
              docker logs --tail 200 dunes-v2-backend 2>&1 || true
              echo "--- readiness endpoint ---"
              docker exec dunes-v2-backend curl -sS http://localhost:9099/actuator/health/readiness 2>&1 || true
              exit 1
            fi
            public_response=$(curl -sS --connect-timeout 10 --max-time 30 -D - -o /dev/null -w '\n%{http_code}' https://www.dunes-insolites.com/)
            public_status=$(printf '%s\n' "$public_response" | tail -n 1)
            case "$public_status" in
              2??|3??)
                ;;
              503)
                # A global maintenance window deliberately returns 503 for SEO.
                # Accept it only when Next.js confirms the maintenance rewrite;
                # an nginx/Cloudflare/origin 503 must still fail deployment.
                printf '%s\n' "$public_response" | grep -qi '^x-middleware-rewrite: /maintenance/' || {
                  echo "public site returned an unexpected 503"
                  printf '%s\n' "$public_response"
                  docker logs --tail 100 dunes-v2-frontend 2>&1 || true
                  exit 1
                }
                echo "public site is intentionally in maintenance mode"
                ;;
              *)
                echo "public site smoke check failed (HTTP $public_status)"
                printf '%s\n' "$public_response"
                docker logs --tail 100 dunes-v2-frontend 2>&1 || true
                exit 1
                ;;
            esac
            curl -sf --connect-timeout 10 --max-time 30 -o /dev/null https://admin.dunesinsolites.com/
            echo "deploy verified: backend healthy, frontend + admin responding"

  # Real post-deploy verification against the live site — not an independent
  # canary anymore (it used to run disconnected from everything else, gated
  # only on an opt-in variable, which is why it never actually ran). Wired to
  # the thing it's meant to catch: a deploy that ships but breaks SEO. Runs
  # only after `deploy` succeeds; `needs` on a skipped job skips this one too,
  # so it stays inert on PRs/branches exactly like before. continue-on-error:
  # a false positive here must never block or roll back a deploy that already
  # shipped — it's a loud warning in the Actions UI, not a gate.
  post-deploy-seo-check:
    needs: [deploy]
    if: vars.SEO_BASE_URL != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: SEO URL contract against ${{ vars.SEO_BASE_URL }}
        run: node scripts/verify-production-urls.mjs
        env:
          BASE_URL: ${{ vars.SEO_BASE_URL }}
          SEO_PROFILE: ${{ vars.SEO_PROFILE || 'nextjs' }}
