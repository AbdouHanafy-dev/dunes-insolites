# Part A — hardened backend stack, deployed ALONGSIDE the old one on the VPS.
#
#   docker compose -p dunes-v2 -f docker-compose.vps.yml --env-file .env.vps up -d --build
#
# Distinct container names + ports + volumes + network from the running
# `duneinsolite-*` stack, so nothing collides and the old stack stays up as an
# instant rollback until nginx is flipped. Fresh Postgres → Flyway V1–V8 runs
# clean. Fresh Keycloak → imports the scrubbed realm and generates a new
# client secret (that IS the rotation).
#
# nginx flip after verification:
#   api.dunesinsolites.com   -> 127.0.0.1:8090
#   auth.dunesinsolites.com  -> 127.0.0.1:8280

services:
  postgres:
    image: postgres:16
    container_name: dunes-v2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: duneinsolite
    volumes:
      - dunes_v2_pgdata:/var/lib/postgresql/data
      - ./docker/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    ports:
      - "127.0.0.1:5444:5432"
    networks: [dunes-v2]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: dunes-v2-keycloak
    restart: unless-stopped
    # Production mode (was start-dev). nginx terminates TLS and forwards
    # X-Forwarded-* ; KC serves plain HTTP on 8180 on the internal network only.
    # KC_HOSTNAME is the full public base URL — it drives the token `iss`,
    # OIDC discovery and every redirect. `start` runs an optimized build on
    # first boot.
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: https://auth.dunesinsolites.com
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8180"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak-realm-duneinsolite.json:/opt/keycloak/data/import/duneinsolite-realm.json:ro
    ports:
      - "127.0.0.1:8280:8180"
    depends_on:
      postgres:
        condition: service_healthy
    # The image has no curl; probe the management health port over bash /dev/tcp.
    # Gives the backend a real readiness signal so its first boot doesn't race
    # Keycloak coming up (previously it failed the KC connect and self-healed on
    # restart).
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 20
    networks: [dunes-v2]

  rabbitmq:
    image: rabbitmq:3-management
    container_name: dunes-v2-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: duneinsolite
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - dunes_v2_rabbitdata:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5682:5672"
      - "127.0.0.1:15682:15672"
    networks: [dunes-v2]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    image: dunes-v2-backend
    container_name: dunes-v2-backend
    restart: unless-stopped
    environment:
      DEPLOY_ENV: production
      APP_PUBLIC_URL: https://api.dunesinsolites.com
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/duneinsolite
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: duneinsolite
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KEYCLOAK_SERVER_URL: http://keycloak:8180
      KEYCLOAK_ISSUER_URL: https://auth.dunesinsolites.com/realms/duneinsolite
      KEYCLOAK_REALM: duneinsolite
      KEYCLOAK_CLIENT_ID: duneinsolite-api
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      APP_CORS_EXTRA_ORIGINS: ${APP_CORS_EXTRA_ORIGINS}
      # SPRING_MAIL_HOST/PORT: unset in .env.vps falls back to Gmail (see
      # application.yml's own default) - set both here to switch provider
      # (e.g. OVH's ssl0.ovh.net:587) without a code change or redeploy of
      # anything but this env file.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      # A cPanel mailbox's recommended outgoing server is implicit SSL on
      # port 465, not STARTTLS on 587 like Gmail - set both when pointing
      # at one (SPRING_MAIL_PORT=465, SPRING_MAIL_SMTP_SSL_ENABLE=true,
      # SPRING_MAIL_SMTP_STARTTLS_ENABLE=false).
      # Must be a real mailbox on the SPRING_MAIL_HOST server, not an
      # invented address - cPanel rejects any "From" it doesn't host
      # ("550 Sender verify failed", found live). Gmail never checked
      # this. Leave unset only while SPRING_MAIL_HOST is still Gmail.
      APP_MAIL_FROM: ${APP_MAIL_FROM:-noreply@duneinsolite.com}
      SPRING_MAIL_SMTP_SSL_ENABLE: ${SPRING_MAIL_SMTP_SSL_ENABLE:-false}
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_CAMPING_EMAIL: ${SEED_CAMPING_EMAIL}
      SEED_CAMPING_PASSWORD: ${SEED_CAMPING_PASSWORD}
      # SEO dashboard (admin /seo/analytics) - see docs/seo-analytics-
      # setup.md. All empty by default (GoogleSeoProperties reports "not
      # configured" rather than erroring). GOOGLE_SERVICE_ACCOUNT_KEY_PATH
      # must match the *container-side* path below exactly - the volumes
      # mount right below re-uses this same variable on both sides so the
      # host path and container path are always the same string, with no
      # second variable to keep in sync.
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID:-}
      SEARCH_CONSOLE_SITE_URL: ${SEARCH_CONSOLE_SITE_URL:-}
      GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:-}
      MANAGEMENT_SERVER_PORT: "9099"
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
      # Keep SMTP monitoring enabled, but use the dedicated readiness group
      # below for container readiness so a mail-provider outage does not make
      # an otherwise working API fail deployment.
      MANAGEMENT_HEALTH_MAIL_ENABLED: "true"
    volumes:
      # Uploaded photos survive redeploys (the container filesystem does not).
      - dunes_v2_uploads:/data/uploads
      # No-op (mounts /dev/null onto itself) until GOOGLE_SERVICE_ACCOUNT_
      # KEY_PATH is actually set in .env.vps - same host path on both
      # sides of the mount, read-only, so the JSON key file the seo-
      # analytics-setup.md guide has you download becomes visible inside
      # the container at the exact path the app was already told to read.
      - ${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:-/dev/null}:${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:-/dev/null}:ro
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:9099:9099"
    # actuator moved to the private mgmt port — override the image's baked-in
    # healthcheck (which hits :8080) to hit the dedicated readiness group on
    # :9099 instead. This group checks the app lifecycle, database and RabbitMQ.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9099/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [dunes-v2]

  # ── New Next.js backoffice — replaces the Angular admin/camping/partner apps ──
  admin:
    build:
      context: ..
      dockerfile: admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.dunesinsolites.com/api
        NEXT_PUBLIC_FRONTEND_URL: https://www.dunes-insolites.com
    image: dunes-v2-admin
    container_name: dunes-v2-admin
    restart: unless-stopped
    environment:
      # OIDC Authorization-Code login (Keycloak hosts the login page → MFA,
      # password reset, lockout messages). Server-side only.
      KEYCLOAK_ISSUER_URL: https://auth.dunesinsolites.com/realms/duneinsolite
      KEYCLOAK_CLIENT_ID: duneinsolite-api
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      ADMIN_BASE_URL: https://admin.dunesinsolites.com
    ports:
      - "127.0.0.1:3110:3100"
    networks: [dunes-v2]

  # ── New Next.js public vitrine — deployed now, cut over from WordPress in Part B ──
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.dunesinsolites.com/api
        NEXT_PUBLIC_ADMIN_APP_URL: https://admin.dunesinsolites.com
        MAINTENANCE_FAIL_CLOSED: ${MAINTENANCE_FAIL_CLOSED:-true}
        MAINTENANCE_BYPASS_SECRET: ${MAINTENANCE_BYPASS_SECRET:-}
    image: dunes-v2-frontend
    container_name: dunes-v2-frontend
    restart: unless-stopped
    environment:
      MAINTENANCE_FAIL_CLOSED: ${MAINTENANCE_FAIL_CLOSED:-true}
      MAINTENANCE_BYPASS_SECRET: ${MAINTENANCE_BYPASS_SECRET:-}
    ports:
      - "127.0.0.1:3010:3000"
    networks: [dunes-v2]

volumes:
  dunes_v2_pgdata:
  dunes_v2_rabbitdata:
  dunes_v2_uploads:

networks:
  dunes-v2:
    driver: bridge
