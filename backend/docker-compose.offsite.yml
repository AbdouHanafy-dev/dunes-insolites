# Off-host backup — LOCAL PROOF of the mechanism.
#
#   docker compose -f docker-compose.yml -f docker-compose.backup.yml -f docker-compose.offsite.yml up -d
#
# Adds a MinIO (S3-compatible) target on the SAME host and points the backup
# sidecar's BACKUP_OFFSITE_CMD / OFFSITE_FETCH_CMD at it via `mc`. This proves
# the code path end to end — dump → push to object storage → pull back from a
# clean location → restore-verify — WITHOUT a real cloud account.
#
# It does NOT close the launch blocker: MinIO here is on the same host as the
# DB, so it is not real off-host protection. For production, swap MinIO for a
# real bucket in another region/provider with versioning + object-lock and put
# the credentials in the environment. See docs/runbooks/offsite-backup-setup.md.

services:
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: dunes-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    networks: [duneinsolite-network]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-setup:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set m http://minio:9000 minioadmin minioadmin
        mc mb -p m/dunes-backups
        mc version enable m/dunes-backups || true
        echo "minio-setup: bucket ready"
    networks: [duneinsolite-network]

  db-backup:
    environment:
      # $1 = archive path, $2 = its .sha256 — matches scripts/db-backup.sh.
      BACKUP_OFFSITE_CMD: >-
        sh -c 'command -v mc >/dev/null || (curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc && chmod +x /usr/local/bin/mc);
        mc alias set m http://minio:9000 minioadmin minioadmin >/dev/null;
        mc cp "$1" m/dunes-backups/ && mc cp "$2" m/dunes-backups/' _
      OFFSITE_FETCH_CMD: >-
        sh -c 'command -v mc >/dev/null || (curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc && chmod +x /usr/local/bin/mc);
        mc alias set m http://minio:9000 minioadmin minioadmin >/dev/null;
        mc cp --recursive m/dunes-backups/ "$1"' _

volumes:
  minio_data:
