version: "3.9"

services:

  # ──────────────────────────────────────────────
  # POSTGRESQL — one instance, two databases
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: duneinsolite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: duneinsolite
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql
    ports:
      - "127.0.0.1:5434:5432"   # host-only - only backend/keycloak need this, over the internal docker network
    networks:
      - duneinsolite-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # KEYCLOAK
  # ──────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: duneinsolite-keycloak
    restart: unless-stopped
    # --import-realm loads any realm JSON under /opt/keycloak/data/import/
    # on boot, but only if that realm doesn't already exist - safe to add
    # to an environment whose "duneinsolite" realm is already there (this
    # dev box's Keycloak has had it, unwritten anywhere as code, since
    # before this repo tracked its history - confirmed via its own Admin
    # API and exported into docker/keycloak-realm-duneinsolite.json,
    # scrubbed of the real client secret and the auto-generated service
    # account user, neither of which a fresh import needs). Without this,
    # a genuinely fresh Keycloak (a new checkout, staging, or real
    # production on day one) has no realm at all, and the backend's own
    # startup seeding (Seed.java -> KeycloakUserSyncService) crash-loops
    # trying to create a user inside a realm that was never created -
    # found by actually running docker-compose.staging.yml end to end
    # (DI-030), not assumed.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}
      KC_HOSTNAME_PORT: 8180
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_HTTP_PORT: 8180
    volumes:
      - ./docker/keycloak-realm-duneinsolite.json:/opt/keycloak/data/import/duneinsolite-realm.json:ro
    ports:
      - "127.0.0.1:8180:8180"   # host-only - reached via nginx (auth.dunesinsolites.com)
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - duneinsolite-network

  # ──────────────────────────────────────────────
  # RABBITMQ
  # ──────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: duneinsolite-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: duneinsolite
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"     # AMQP - host-only, only backend needs this over the internal docker network
      - "127.0.0.1:15672:15672"   # Management UI - host-only, reached via nginx (mq.dunesinsolites.com)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - duneinsolite-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # BACKEND — Spring Boot API
  # ──────────────────────────────────────────────
  backend:
    build:
      context: .
    container_name: duneinsolite-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/duneinsolite
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      KEYCLOAK_SERVER_URL: http://keycloak:8180
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_CAMPING_EMAIL: ${SEED_CAMPING_EMAIL}
      SEED_CAMPING_PASSWORD: ${SEED_CAMPING_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"   # host-only - reached via nginx (api.dunesinsolites.com)
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - duneinsolite-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

  # ──────────────────────────────────────────────
  # FRONTEND — 3 Angular SPAs (static nginx serving)
  # ──────────────────────────────────────────────
  partner-app:
    build:
      context: ../routeinsolite
      args:
        APP_NAME: partner-app
        NG_CONFIGURATION: production
    container_name: duneinsolite-partner-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"   # host-only - reached via nginx (partner.dunesinsolites.com)
    networks:
      - duneinsolite-network

  admin-app:
    build:
      context: ../routeinsolite
      args:
        APP_NAME: admin-app
        NG_CONFIGURATION: production
    container_name: duneinsolite-admin-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:4201:80"   # host-only - reached via nginx (admin.dunesinsolites.com)
    networks:
      - duneinsolite-network

  camping-app:
    build:
      context: ../routeinsolite
      args:
        APP_NAME: camping-app
        NG_CONFIGURATION: production
    container_name: duneinsolite-camping-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:4202:80"   # host-only - reached via nginx (camping.dunesinsolites.com)
    networks:
      - duneinsolite-network

# ──────────────────────────────────────────────
# VOLUMES & NETWORKS
# ──────────────────────────────────────────────
volumes:
  postgres_data:
  rabbitmq_data:

networks:
  duneinsolite-network:
    driver: bridge