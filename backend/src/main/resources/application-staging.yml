# Activated with SPRING_PROFILES_ACTIVE=staging (see docker-compose.staging.yml).
#
# The base application.yml defaults every host-facing property to the
# production IP (79.143.185.33) so a bare `mvn spring-boot:run` works against
# the shared dev server with no setup. That default is exactly wrong for
# staging: if an env var is forgotten here, staging must fail to start, not
# silently start talking to production Postgres/Keycloak/RabbitMQ. Every
# property below removes its production-IP fallback for that reason.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL must be set on staging}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:?SPRING_RABBITMQ_HOST must be set on staging}

  jpa:
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL:?KEYCLOAK_SERVER_URL must be set on staging}/realms/${KEYCLOAK_REALM:duneinsolite}

keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:?KEYCLOAK_SERVER_URL must be set on staging}

app:
  frontend:
    url: ${APP_FRONTEND_URL:?APP_FRONTEND_URL must be set on staging}
