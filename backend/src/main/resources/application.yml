spring:
  config:
    # Dev-machine environment override, loaded unconditionally when the
    # matching file is present — no active profile or IDE run-config env vars
    # required. Defaults to `local` (application-local.yml, gitignored — see
    # LOCAL_DEV_SETUP.pdf) so zero-config local dev keeps working exactly as
    # before. Set DEV_ENV to load a different file instead (e.g. `preprod` ->
    # application-preprod.yml) once one exists — nothing else to change here.
    # Absent on every real deployment, so `optional:` makes this a no-op
    # everywhere else.
    import: "optional:classpath:application-${DEV_ENV:local}.yml"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://79.143.185.33:5433/duneinsolite}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema (see spring.flyway below and
      # docs/runbooks/database-migrations.md). `validate` lets Hibernate verify
      # the entities match the migrated schema on boot and fail fast if they
      # drift — it never mutates the database. Do NOT set this back to `update`.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # The DB up to 2 Sep 2026 was built entirely by ddl-auto:update and has no
    # flyway_schema_history. baseline-on-migrate stamps such a database at
    # version 1 (V1__baseline_schema.sql) WITHOUT executing it, then applies
    # V2+. A brand-new empty database runs V1 normally.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "pre-Flyway schema (ddl-auto:update era)"
    # Fail the boot rather than silently leave a partially-migrated schema.
    validate-on-migrate: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:79.143.185.33}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:duneinsolite}
    password: ${SPRING_RABBITMQ_PASSWORD}
    listener:
      simple:
        # Default factory (NotificationConsumer): manual ack, handled in-code.
        # The transactional-email path uses its own factory with real retry +
        # dead-lettering - see RabbitMQConfig.emailListenerContainerFactory and
        # `app.email.retry.*` below.
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 5000
          max-attempts: 3
          multiplier: 2

  security:
    oauth2:
      resourceserver:
        jwt:
          # Not read at runtime today - SecurityConfig.jwtDecoder() builds its own
          # NimbusJwtDecoder from keycloak.admin.server-url + keycloak.realm, so
          # Boot's issuer-uri-driven autoconfiguration never activates. Externalized
          # anyway for consistency/future-proofing.
          issuer-uri: ${KEYCLOAK_SERVER_URL:http://79.143.185.33:8180}/realms/${KEYCLOAK_REALM:duneinsolite}

  mvc:
    async:
      # SSE streams (/api/notifications/subscribe) must not be timed out by the
      # container. Replaces a dead AsyncSupportConfigurer @Bean in CorsConfig
      # that never took effect.
      request-timeout: -1

  servlet:
    multipart:
      max-file-size: 8MB   # matches MediaServiceImpl's own MAX_SIZE_BYTES check
      max-request-size: 8MB

  mail:
    # Defaults keep local dev on Gmail unchanged; a real deployment can
    # point this at any SMTP provider via env vars without a code change.
    # Found live: a cPanel mailbox's "recommended" outgoing server is
    # implicit SSL on port 465 (mail.<domain>), not STARTTLS on 587 like
    # Gmail - the two are mutually exclusive on the wire, so both knobs
    # are exposed rather than hardcoding one provider's shape.
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${SPRING_MAIL_SMTP_SSL_ENABLE:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
        debug: false                      # set to true temporarily if emails aren't sending

seed:
  admin:
    email: ${SEED_ADMIN_EMAIL:}
    password: ${SEED_ADMIN_PASSWORD:}
  camping:
    email: ${SEED_CAMPING_EMAIL:}
    password: ${SEED_CAMPING_PASSWORD:}

keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:http://79.143.185.33:8180}
    realm: ${KEYCLOAK_REALM:duneinsolite}
    client-id: ${KEYCLOAK_CLIENT_ID:duneinsolite-api}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
  realm: ${KEYCLOAK_REALM:duneinsolite}
  client-id: ${KEYCLOAK_CLIENT_ID:duneinsolite-api}
  # Public token issuer for strict `iss` + `azp` validation. Set in production
  # to the browser-facing realm URL; unset for local dev / tests. See SecurityConfig.
  issuer-url: ${KEYCLOAK_ISSUER_URL:}

server:
  port: 8080

management:
  # PRODUCTION monitoring: set the env var MANAGEMENT_SERVER_PORT to a private
  # port (e.g. 9099) that the Prometheus scraper reaches on the internal network
  # but that is NOT published to the internet / Cloudflare, plus (bare host)
  # MANAGEMENT_SERVER_ADDRESS=127.0.0.1. Spring then serves the actuator surface
  # ONLY on that port and the actuatorSecurityFilterChain in SecurityConfig lets
  # the scrape through without a JWT — safe only because the port is
  # unreachable from outside. Left unset here so the default is unchanged:
  # actuator on the main port, /actuator/** ADMIN-only. application-local.yml
  # sets it to 9099 for local dev. See docs/runbooks/production-monitoring.md.
  endpoints:
    web:
      exposure:
        # health is public (SecurityConfig); metrics/prometheus/info are
        # ADMIN-only on the main port, or unauthenticated on a private
        # MANAGEMENT_SERVER_PORT. Nothing that dumps env / config / heap is exposed.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Unauthenticated callers see only {"status":"UP"}; an authenticated
      # ADMIN sees per-component detail. No secrets in either case.
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
      group:
        # readiness fails - and the instance is pulled from rotation - when a
        # dependency it cannot serve without is down, not merely when the JVM
        # is alive.
        readiness:
          include: readinessState, db, rabbit
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false
    java:
      enabled: true
    os:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  # Set LOG_FORMAT=ecs on production for structured JSON logs (one object per
  # line, MDC fields included) that a log aggregator can index. Empty = the
  # human-readable console format for local dev.
  structured:
    format:
      console: ${LOG_FORMAT:}
  pattern:
    # Every log line carries the correlation id that follows a unit of work
    # across HTTP -> RabbitMQ -> consumer -> DLQ -> replay. Empty ("-") for
    # background work that started without one. (Ignored when LOG_FORMAT is set.)
    level: "%5p [%X{correlationId:-}]"

# ── App-level properties (used in EmailService) ─────────────────
app:
  public-url: ${APP_PUBLIC_URL:}   # origin used for uploaded-file links; blank = from the request
  upload-dir: ${APP_UPLOAD_DIR:uploads}   # local disk, see MediaServiceImpl/WebConfig
  mail:
    # Was never actually configurable - EmailService's @Value default
    # ("noreply@duneinsolite.com") was the only value ever used. Found
    # live: a cPanel mail server rejects sending "From" any address that
    # isn't a real mailbox it hosts ("550 Sender verify failed") - this
    # must match SPRING_MAIL_USERNAME's real mailbox once that's a cPanel
    # account rather than Gmail (which never checked this).
    from: ${APP_MAIL_FROM:noreply@duneinsolite.com}
    # Who gets the team email about a booking's life (new / confirmed / cancelled) - see
    # StaffBookingNotifier. Two separate legal entities, two inboxes: circuits (Route Insolite)
    # use *-circuits, everything else (Dunes Insolites: stays, activities) uses the plain one.
    # Comma-separated. Blank = every ADMIN account, independently for each.
    staff-booking-recipients: ${APP_STAFF_BOOKING_EMAILS:}
    staff-booking-recipients-circuits: ${APP_STAFF_BOOKING_EMAILS_CIRCUITS:}
  email:
    retry:
      # Transactional-email listener (ReservationEmailConsumer). After
      # max-attempts the message is dead-lettered to notification.dlq.
      max-attempts: ${APP_EMAIL_RETRY_MAX_ATTEMPTS:4}
      initial-interval-ms: ${APP_EMAIL_RETRY_INITIAL_MS:2000}
      multiplier: ${APP_EMAIL_RETRY_MULTIPLIER:2.0}
      max-interval-ms: ${APP_EMAIL_RETRY_MAX_MS:15000}
  reservation:
    # Phase 2 — how long a public guest hold reserves accommodation inventory
    # before HoldExpiryJob releases it. Default 1440 = 24h.
    # BUSINESS DECISION (F-3): confirm the real hold window for launch.
    hold-duration-minutes: ${APP_RESERVATION_HOLD_MINUTES:1440}
    # How often the expiry sweep runs. Not correctness-critical (availability
    # already ignores expired holds) — just housekeeping.
    hold-expiry-sweep-ms: ${APP_RESERVATION_HOLD_SWEEP_MS:300000}
  admin:
    url: ${APP_ADMIN_URL:https://admin.dunesinsolites.com}   # backoffice, for the button in the team's new-booking email
  frontend:
    url: ${APP_FRONTEND_URL:http://79.143.185.33:4200}   # browser-facing (email links) - stays 79.143.185.33 even in Docker
  cors:
    extra-origins: ${APP_CORS_EXTRA_ORIGINS:}   # comma-separated staging/preview hosts, see CorsConfig

# ── SEO dashboard: GA4 + Search Console (admin/seo/analytics) ───
# All three empty by default - the admin dashboard shows "not connected"
# rather than erroring until a real service account exists. See
# docs/seo-analytics-setup.md for the full one-time setup (Google Cloud
# project, service account, granting it access on the real GA4 property
# and Search Console property) - nothing here is usable until that's done.
# GOOGLE_SERVICE_ACCOUNT_KEY_PATH points at a JSON key file that must never
# be committed - same rule as backend/.env.
google:
  analytics:
    property-id: ${GA4_PROPERTY_ID:}
  search-console:
    site-url: ${SEARCH_CONSOLE_SITE_URL:}
  service-account-key-path: ${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:}
  # The real Google Business rating (admin "Coordonnées" screen, on
  # request 15 Sep 2026) — a plain API key (not a service account), only
  # ever used to call Places API Details for the one placeId set in
  # SiteSettings. Empty by default; GooglePlacesService just skips the
  # fetch until this is set.
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:}
