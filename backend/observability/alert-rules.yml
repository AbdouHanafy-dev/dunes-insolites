# Alert rules — the "metrics worth alerting on" table in
# docs/runbooks/observability.md, made executable. Thresholds are starting
# points; tune against real production baselines after go-live.

groups:
  - name: dunes-availability
    rules:
      - alert: BackendMetricsUnreachable
        expr: up{job="dunes-backend"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Backend /actuator/prometheus unreachable for 2m"
          runbook: "docs/runbooks/incident-response.md"

      - alert: ApiNotReady
        expr: probe_success{job="dunes-readiness"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Readiness probe DOWN >2m — a dependency (db / rabbit) is unavailable; the instance cannot take bookings"
          runbook: "docs/runbooks/incident-response.md"

      - alert: ReadinessProbeHttpError
        expr: probe_http_status_code{job="dunes-readiness"} != 200 and probe_http_status_code{job="dunes-readiness"} != 0
        for: 3m
        labels: { severity: warning }
        annotations:
          summary: "Readiness endpoint returning HTTP {{ $value }}"

  - name: dunes-reliability
    rules:
      - alert: EmailDeadLettering
        expr: increase(email_dead_letter_total{action="recorded"}[15m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "Confirmation email(s) dead-lettered in the last 15m"
          runbook: "docs/runbooks/email-and-dead-letters.md"

      - alert: EmailFailureRate
        expr: sum(rate(email_dispatch_total{result="failed"}[10m])) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Sustained transactional-email failures (SMTP degraded)"

      - alert: NotificationDlqBacklog
        expr: rabbitmq_queue_messages{queue=~".*dlq|.*dead.*"} > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Messages sitting in a dead-letter queue for >10m"
          note: "requires the RabbitMQ prometheus plugin; otherwise EmailDeadLettering covers the email path"

  - name: dunes-http
    rules:
      - alert: High5xxRate
        expr: >
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001)
          > 0.02
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "5xx rate above 2% of requests for 5m"

      - alert: BookingEndpointErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5..", uri=~"/api/public/.*bookings.*"}[5m])) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "5xx on a public booking endpoint — guests cannot book"

  - name: dunes-resources
    rules:
      - alert: JvmHeapPressure
        expr: >
          sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "JVM heap >90% for 10m — leak or undersized"

  - name: dunes-backups
    rules:
      # Emitted by scripts/db-backup.sh via a textfile/pushgateway hook you add
      # on the backup host (see docs/runbooks/offsite-backup-setup.md).
      - alert: BackupStale
        expr: time() - dunes_backup_last_success_timestamp_seconds > 129600  # 36h
        labels: { severity: critical }
        annotations:
          summary: "No successful DB backup in >36h"
          runbook: "docs/runbooks/backup-restore.md"

      - alert: OffsiteCopyFailing
        expr: increase(dunes_backup_offsite_failure_total[1h]) > 0
        labels: { severity: critical }
        annotations:
          summary: "Off-site backup copy failed in the last hour"
          runbook: "docs/runbooks/offsite-backup-setup.md"
