spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://79.143.185.33:5433/duneinsolite}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:79.143.185.33}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:duneinsolite}
    password: ${SPRING_RABBITMQ_PASSWORD:duneinsolite123}
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 5000
          max-attempts: 3
          multiplier: 2

  security:
    oauth2:
      resourceserver:
        jwt:
          # Not read at runtime today - SecurityConfig.jwtDecoder() builds its own
          # NimbusJwtDecoder from keycloak.admin.server-url + keycloak.realm, so
          # Boot's issuer-uri-driven autoconfiguration never activates. Externalized
          # anyway for consistency/future-proofing.
          issuer-uri: ${KEYCLOAK_SERVER_URL:http://79.143.185.33:8180}/realms/${KEYCLOAK_REALM:duneinsolite}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:bacemakkari25@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:wfze sgwp oxwl zmeh}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false                      # set to true temporarily if emails aren't sending

keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:http://79.143.185.33:8180}
    realm: ${KEYCLOAK_REALM:duneinsolite}
    client-id: ${KEYCLOAK_CLIENT_ID:duneinsolite-api}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
  realm: ${KEYCLOAK_REALM:duneinsolite}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ── App-level properties (used in EmailService) ─────────────────
app:
  mail:
    from: noreply@duneinsolite.com        # display sender address in outgoing emails
  frontend:
    url: ${APP_FRONTEND_URL:http://79.143.185.33:4200}   # browser-facing (email links) - stays 79.143.185.33 even in Docker
