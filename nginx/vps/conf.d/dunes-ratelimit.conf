# Rate-limit zones for the public attack surface (defense in depth on top of
# the app's own RateLimitFilter). 10r/m for auth, 30r/m for public POSTs.
limit_req_zone $binary_remote_addr zone=dunes_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dunes_pub:10m rate=30r/m;
limit_req_status 429;
