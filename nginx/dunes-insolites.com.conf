# DI-023 — WordPress/Next.js split for www.dunes-insolites.com
#
# ⚠️ DRAFT — written blind, without access to the production server or its
# current nginx config. Review every value marked TODO before deploying.
# nginx is NOT containerized in this repo (see ARCHITECTURE.md §2 — it's
# the host's sole ingress, everything else binds to 127.0.0.1); this file
# has no home in docker-compose and must be dropped into the server's own
# nginx sites-available/sites-enabled by hand.
#
# Strategy: **WordPress is the default.** Only the paths Next.js actually
# serves today are allowlisted to it; everything else still falls through
# to WordPress, which is still the live, functional site for those pages.
# This is the safe direction for a strangler migration — the allowlist only
# grows as more pages migrate, and an unanticipated URL (a media file, an
# old campaign link, anything not in the crawl this list was built from)
# fails safe to the site that has always served it, not to a Next 404.
#
# The allowlist below was computed by diffing every one of the 63 URLs in
# the Sprint 0 baseline crawl (docs/seo-baseline/20260826T084416Z.json)
# against the legacy slugs next.config.ts already rewrites
# (frontend/lib/legacySlugs.ts) — see scripts/nginx-wordpress-allowlist.mjs,
# which regenerates the "still on WordPress" list so this file can be kept
# in sync as more pages migrate. Re-run it and update this file each time a
# legacy page gets a real Next.js route.

upstream next_app {
    # TODO: confirm host/port. Matches backend/docker-compose.yml conventions
    # (127.0.0.1-bound, reached only via this proxy) but the frontend isn't
    # in that compose file today - confirm wherever `npm run build && npm
    # start` (or its container) actually listens on the production host.
    server 127.0.0.1:3000;
}

upstream wordpress {
    # TODO: fill in - wherever the existing WordPress/WooCommerce install
    # is actually served from today (a different host, a different local
    # port, or an entirely separate box this nginx reverse-proxies to).
    server 127.0.0.1:8081;
}

server {
    listen 443 ssl;
    server_name www.dunes-insolites.com dunes-insolites.com;

    # TODO: TLS cert paths - whatever this server already uses for the
    # other *.dunesinsolites.com / *.dunes-insolites.com vhosts.
    # ssl_certificate     /etc/letsencrypt/live/dunes-insolites.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dunes-insolites.com/privkey.pem;

    # ── Next.js's own build assets and well-known files — never WordPress ──
    location /_next/ {
        proxy_pass http://next_app;
        proxy_set_header Host $host;
    }

    location = /favicon.ico { proxy_pass http://next_app; }
    location = /robots.txt { proxy_pass http://next_app; }
    location = /sitemap.xml { proxy_pass http://next_app; }
    location = /manifest.webmanifest { proxy_pass http://next_app; }

    # ── Pages Next.js actually serves today ─────────────────────────────
    # Generated - see scripts/nginx-wordpress-allowlist.mjs. Keep in sync
    # with frontend/lib/legacySlugs.ts and this app's own native routes.
    location ~ ^/(nuitee-campement-desert|bivouac-desert-tunisie|sandboarding-desert|quad-desert|bedouin-diner-sahara-tunisien|soirees-sous-les-etoiles|le-pain-de-sabel|presentation-campement-dunes-insolites|dunes-insolites-camp-gallery)/?$ {
        proxy_pass http://next_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Native app routes (never had a legacy WordPress URL to preserve).
    location ~ ^/(activities|camp|gallery|about|safety|contact|legal|book|bookings|login|signup|api)(/|$) {
        proxy_pass http://next_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = / {
        proxy_pass http://next_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Everything else: still WordPress ────────────────────────────────
    # Blog (/blog-desert/, /blog-sahara-tunisie/, all 18 posts), category
    # archives, the not-yet-migrated informational/listing pages, the nine
    # Route Insolite circuit pages (pending Q6), and the WooCommerce
    # account/cart pages (/mon-compte/, /panier/, /mes-reservations/, etc).
    location / {
        proxy_pass http://wordpress;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name www.dunes-insolites.com dunes-insolites.com;
    return 301 https://www.dunes-insolites.com$request_uri;
}
