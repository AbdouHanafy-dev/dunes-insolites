# DI-023 — WordPress/Next.js split for www.dunes-insolites.com
#
# ⚠️ DRAFT — written blind, without access to the production server or its
# current nginx config. The two remaining TODOs (real upstream host/port,
# real TLS certificate paths) need that access and are still open. nginx is
# NOT containerized in this repo (see ARCHITECTURE.md §2 — it's the host's
# sole ingress, everything else binds to 127.0.0.1); this file has no home
# in docker-compose and must be dropped into the server's own nginx
# sites-available/sites-enabled by hand.
#
# What IS verified (29 Aug 2026, see nginx/README.md): the config parses
# under a real nginx (`nginx -t`, which caught a real bug — no
# ssl_certificate directive with only the TODO placeholder in place - not
# just the expected-blank TLS paths), and every routing category behaves
# correctly against a real running frontend in a throwaway Docker
# container: DI-022 rewrites, DI-024 redirects, native routes, and the
# WordPress-catch-all fallback. Re-run that same check after editing any
# allowlist regex, before touching the real server.
#
# Strategy: **WordPress is the default.** Only the paths Next.js actually
# serves today are allowlisted to it; everything else still falls through
# to WordPress, which is still the live, functional site for those pages.
# This is the safe direction for a strangler migration — the allowlist only
# grows as more pages migrate, and an unanticipated URL (a media file, an
# old campaign link, anything not in the crawl this list was built from)
# fails safe to the site that has always served it, not to a Next 404.
#
# The allowlist below was computed by diffing every one of the 63 URLs in
# the Sprint 0 baseline crawl (docs/seo-baseline/20260826T084416Z.json)
# against the legacy slugs next.config.ts already rewrites
# (frontend/lib/legacySlugs.ts) — see scripts/nginx-wordpress-allowlist.mjs,
# which regenerates the "still on WordPress" list so this file can be kept
# in sync as more pages migrate. Re-run it and update this file each time a
# legacy page gets a real Next.js route.

upstream next_app {
    # TODO: confirm host/port. Matches backend/docker-compose.yml conventions
    # (127.0.0.1-bound, reached only via this proxy) but the frontend isn't
    # in that compose file today - confirm wherever `npm run build && npm
    # start` (or its container) actually listens on the production host.
    server 127.0.0.1:3000;
}

upstream wordpress {
    # TODO: fill in - wherever the existing WordPress/WooCommerce install
    # is actually served from today (a different host, a different local
    # port, or an entirely separate box this nginx reverse-proxies to).
    server 127.0.0.1:8081;
}

server {
    listen 443 ssl;
    server_name www.dunes-insolites.com dunes-insolites.com;

    # TODO: TLS cert paths - whatever this server already uses for the
    # other *.dunesinsolites.com / *.dunes-insolites.com vhosts.
    # ssl_certificate     /etc/letsencrypt/live/dunes-insolites.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dunes-insolites.com/privkey.pem;

    # ── Next.js's own build assets and well-known files — never WordPress ──
    location /_next/ {
        proxy_pass http://next_app;
        proxy_set_header Host $host;
    }

    location = /favicon.ico { proxy_pass http://next_app; }
    location = /robots.txt { proxy_pass http://next_app; }
    location = /sitemap.xml { proxy_pass http://next_app; }
    location = /manifest.webmanifest { proxy_pass http://next_app; }

    # ── Pages Next.js actually serves today ─────────────────────────────
    # Generated - see scripts/nginx-wordpress-allowlist.mjs. Keep in sync
    # with frontend/lib/legacySlugs.ts and this app's own native routes.
    location ~ ^/(nuitee-campement-desert|bivouac-desert-tunisie|sandboarding-desert|quad-desert|bedouin-diner-sahara-tunisien|soirees-sous-les-etoiles|le-pain-de-sabel|presentation-campement-dunes-insolites|dunes-insolites-camp-gallery)/?$ {
        proxy_pass http://next_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── DI-024: legacy URLs that now 301 inside Next.js (frontend/
    # middleware.ts, backed by the Redirect table an admin can edit at
    # /seo/redirections) rather than being rewritten to real content.
    # scripts/nginx-wordpress-allowlist.mjs does NOT know about these - it
    # only diffs frontend/lib/legacySlugs.ts's rewrites, a different
    # mechanism. Added by hand from scripts/seed-legacy-redirects.py's own
    # list; keep the two in sync manually until the generator script learns
    # to read the Redirect table too. Includes the Route Insolite circuit
    # URLs (Ksar Ghilane, Tataouine/Chenini, Douz-Matmata, 4x4...) - Q6
    # keeps that *product* on dunes-insolites.com rather than moving it
    # cross-domain, but each of those URLs still needs to reach Next.js so
    # middleware.ts can 301 it to the real /circuits "coming soon" page,
    # not fall through to WordPress's old (now-inaccurate) circuit content.
    # Also the account pages and service hub pages that got a real
    # redirect target in the new app.
    location ~ ^/(mes-reservations|mon-compte|mot-de-passe-oublie|dunes-insolites-sabria-evasion-sahara|nuit-desert-tunisien-dunes-insolites|bivouac-desert-tunisien-sahara|spend-a-night-in-the-tunisian-desert-at-dunes-insolites-camp|services|services/activites|services/sejours|services/tours|6-jours-excursion-desert-tunisien|circuit-4-jours-desert-tunisien-djerba-tataouine-tozeur|circuit-tataouine-et-chenini-au-depart-de-djerba|day-trip-desert-douz-and-matmata|desert-3-jour|excursion-2-jours-desert-tunisien|excursion-desert-tunisie-2-jours|excursion-dune-journee-a-ksar-ghilane|excursion-tataouine-chenini-desert-tunisie-star-wars|immersion-saharienne-2-nuits-daventure-en-camp-et-bivouac|ksar-ghilane-desert-tunisia|tour-desert-tunisia|tunisie-sahara-en-4x4)/?$ {
        proxy_pass http://next_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Native app routes (never had a legacy WordPress URL to preserve).
    # `account` added alongside DI-024 - it already existed as a real route
    # (frontend/app/[locale]/account/) but was missing from this allowlist
    # before now, which would have sent it to WordPress by accident; caught
    # while wiring /mon-compte/'s redirect target here.
    location ~ ^/(activities|camp|gallery|about|safety|contact|legal|book|bookings|login|signup|account|circuits|api)(/|$) {
        proxy_pass http://next_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = / {
        proxy_pass http://next_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Everything else: still WordPress ────────────────────────────────
    # Blog (/blog-desert/, /blog-sahara-tunisie/, all ~16 posts), category
    # archives, Templately builder pages, and /panier/ (no equivalent page
    # exists yet, left unmapped rather than guessed at - see
    # scripts/seed-legacy-redirects.py's own header). The Route Insolite
    # circuit pages (Ksar Ghilane, Tataouine/Chenini, Douz-Matmata, 4x4...)
    # and the WooCommerce account/cart pages that DID get a real redirect
    # target are now in the DI-024 allowlist block above, not here.
    location / {
        proxy_pass http://wordpress;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name www.dunes-insolites.com dunes-insolites.com;
    return 301 https://www.dunes-insolites.com$request_uri;
}
